bypass:
  - path: ^/api/
  - path: ^/federation/
  - path: ^/rest/
  - path: ^/\.well-known/
  - path: ^/media/
  - path: ^/staticfiles/
# from https://anubis.techaro.lol/docs/admin/policies/
bots:
  - name: cloudflare-workers
    headers_regex:
      CF-Worker: .*
    action: DENY
  - name: well-known
    path_regex: ^/.well-known/.*$
    action: ALLOW
  - name: favicon
    path_regex: ^/favicon.ico$
    action: ALLOW
  - name: robots-txt
    path_regex: ^/robots.txt$
    action: ALLOW
  - name: generic-browser
    user_agent_regex: Mozilla
    action: CHALLENGE
